<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account maken - HelpDesk</title>
    <link rel="stylesheet" href="styling.css">
</head>
<body>
    <div class="topbar">
        <span>HelpDesk</span>
    </div>
    <div class="page-content">
        <main class="login-card">
            <h1>Account maken</h1>
            <p class="subtitle">Maak een account aan om de helpdesk chatbot te gebruiken.</p>
            <form method="post">
                <div class="form-group">
                    <label for="username">Gebruikersnaam</label>
                    <input type="text" id="username" name="username" placeholder="Kies een gebruikersnaam" required>
                </div>
                <div class="form-group">
                    <label for="password">Wachtwoord</label>
                    <input type="password" id="password" name="password" placeholder="Kies een wachtwoord" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password"> Bevestig wachtwoord</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Bevestig je wachtwoord" required>
                </div>
                <button type="submit">Account maken</button>
            </form>
        </main>
    </div>
</body>
</html>
