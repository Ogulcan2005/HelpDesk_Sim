<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account maken - HelpDesk</title>
    <style>
        :root {
            --brand: #007d84;
            --brand-dark: #00676d;
            --bg: #eef2f6;
            --text: #1f2933;
            --muted: #5b6770;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--brand);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 18px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            gap: 10px;
        }

        .page-content {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 92px 20px 24px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 14px 30px rgba(17, 24, 39, 0.12);
            padding: 26px 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        .subtitle {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            border: 1px solid #c8d2db;
            border-radius: 8px;
            padding: 12px 13px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(0, 125, 132, 0.15);
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 4px;
        }

        button:hover {
            background: var(--brand-dark);
        }
    </style>
</head>
<body>
    <div class="topbar">
        <span>HelpDesk</span>
    </div>
    <div class="page-content">
        <main class="login-card">
            <h1>Account maken</h1>
            <p class="subtitle">Maak een account aan om de helpdesk chatbot te gebruiken.</p>
            <form method="post">
                <div class="form-group">
                    <label for="username">Gebruikersnaam</label>
                    <input type="text" id="username" name="username" placeholder="Kies een gebruikersnaam" required>
                </div>
                <div class="form-group">
                    <label for="password">Wachtwoord</label>
                    <input type="password" id="password" name="password" placeholder="Kies een wachtwoord" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password"> Bevestig wachtwoord</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Bevestig je wachtwoord" required>
                </div>
                <button type="submit">Account maken</button>
            </form>
        </main>
    </div>
</body>
</html>
