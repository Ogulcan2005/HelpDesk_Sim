<!DOCTYPE html>
<html>
<head>
    <title>Chatbot</title>
    <style>
        :root {
            --brand: #007d84;
            --brand-dark: #00676d;
            --bg: #eef2f6;
            --text: #1f2933;
            --muted: #5b6770;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--brand);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 18px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            gap: 10px;
        }

        .page-content {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 92px 20px 24px;
        }

        .chat-card {
            width: 100%;
            max-width: 720px;
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 14px 30px rgba(17, 24, 39, 0.12);
            padding: 26px 24px;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }



        .subtext {
            margin: 8px 0 18px;
            color: var(--muted);
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        #question {
            flex: 1;
            border: 1px solid #c8d2db;
            border-radius: 8px;
            padding: 12px 13px;
            font-size: 1rem;
            outline: none;
        }

        #question:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(0, 125, 132, 0.15);
        }

        button {
            border: none;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            padding: 0 18px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover {
            background: var(--brand-dark);
        }

        .btn-secondary {
            display: inline-block;
            background: #ebf4f5;
            color: #144649;
            text-decoration: none;
            border-radius: 8px;
            padding: 10px 12px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        #answer {
            margin: 0;
            min-height: 54px;
            padding: 13px 14px;
            border-radius: 8px;
            border-left: 4px solid var(--brand);
            background: #edf7f8;
            color: #25313a;
            line-height: 1.45;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <span>HelpDesk</span>
    </div>
    <div class="page-content">
        <main class="chat-card">
            <div class="header-row">
                <h1>Chatbot voor de helpdesk</h1>
            </div>
            <p class="subtext">Stel een vraag aan de chatbot of bekijk de gestylede admin/docent interface.</p>
            <div class="input-row">
                <input type="text" id="question" placeholder="Stel je vraag...">
                <button onclick="askQuestion()">Vraag</button>
            </div>
            <p id="answer">Hier komt het antwoord te staan...</p>
        </main>
    </div>

    <script>
    function askQuestion() {
        let question = document.getElementById("question").value.trim();
        const answerEl = document.getElementById("answer");

        if (!question) {
            answerEl.innerText = "Typ eerst een vraag.";
            return;
        }

        answerEl.innerText = "Bezig met laden...";

        fetch(`/chatbot/?question=${encodeURIComponent(question)}`)
            .then(res => res.json())
            .then(data => {
                answerEl.innerText = data.answer || "Geen antwoord ontvangen.";
            })
            .catch(() => {
                answerEl.innerText = "Er ging iets mis. Probeer opnieuw.";
            });
    }
    </script>
</body>
</html>
