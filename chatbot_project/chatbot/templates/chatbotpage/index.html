<!DOCTYPE html>
<html>
<head>
    <title>Chatbot</title>
    <link rel="stylesheet" href="styling.css">
</head>
<body>
    <div class="topbar">
        <span>HelpDesk</span>
    </div>
    <div class="page-content">
        <main class="chat-card">
            <div class="header-row">
                <h1>Chatbot voor de helpdesk</h1>
            </div>
            <p class="subtext">Stel een vraag aan de chatbot of bekijk de gestylede admin/docent interface.</p>
            <div class="input-row">
                <input type="text" id="question" placeholder="Stel je vraag...">
                <button onclick="askQuestion()">Vraag</button>
            </div>
            <p id="answer">Hier komt het antwoord te staan...</p>
        </main>
    </div>

    <script>
    function askQuestion() {
        let question = document.getElementById("question").value.trim();
        const answerEl = document.getElementById("answer");

        if (!question) {
            answerEl.innerText = "Typ eerst een vraag.";
            return;
        }

        answerEl.innerText = "Bezig met laden...";

        fetch(`/chatbot/?question=${encodeURIComponent(question)}`)
            .then(res => res.json())
            .then(data => {
                answerEl.innerText = data.answer || "Geen antwoord ontvangen.";
            })
            .catch(() => {
                answerEl.innerText = "Er ging iets mis. Probeer opnieuw.";
            });
    }
    </script>
</body>
</html>
