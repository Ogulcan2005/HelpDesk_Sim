<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen - HelpDesk</title>
    <link rel="stylesheet" href="styling.css">
</head>
<body>
    <div class="topbar">
        <span>HelpDesk</span>
    </div>
    <div class="page-content">
        <main class="login-card">
            <h1>Inloggen</h1>
            <p class="subtitle">Log in om de helpdesk chatbot te gebruiken.</p>
            <form method="post">
                <div class="form-group">
                    <label for="username">Gebruikersnaam</label>
                    <input type="text" id="username" name="username" placeholder="Vul je gebruikersnaam in" required>
                </div>
                <div class="form-group">
                    <label for="password">Wachtwoord</label>
                    <input type="password" id="password" name="password" placeholder="Vul je wachtwoord in" required>
                </div>
                <div class="forgot-password">
                    <a href="#">Wachtwoord vergeten?</a>
                </div>
                <button type="submit">Inloggen</button>
                <a class="secondary-button" href="#">Account maken</a>
            </form>
        </main>
    </div>
</body>
</html>
