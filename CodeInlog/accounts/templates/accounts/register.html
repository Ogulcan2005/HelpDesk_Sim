<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account aanmaken - HelpDesk</title>
    <style>
        :root {
            --brand: #007d84;
            --brand-dark: #00676d;
            --bg: #eef2f6;
            --text: #1f2933;
            --muted: #5b6770;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--brand);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 18px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            gap: 10px;
            z-index: 10;
        }

        .page-content {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 92px 20px 24px;
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 14px 30px rgba(17, 24, 39, 0.12);
            padding: 26px 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        .subtitle {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .notice {
            margin: 0 0 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #e7f6f7;
            color: #0f4d52;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            border: 1px solid #c8d2db;
            border-radius: 8px;
            padding: 12px 13px;
            font-size: 1rem;
            outline: none;
            background: #fff;
        }

        input:focus, select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(0, 125, 132, 0.15);
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 4px;
        }

        button:hover {
            background: var(--brand-dark);
        }

        .secondary-button {
            display: block;
            width: 100%;
            border: 1px solid var(--brand);
            border-radius: 8px;
            color: var(--brand);
            background: #fff;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 16px;
            text-align: center;
            text-decoration: none;
            margin-top: 10px;
            transition: background 0.15s ease;
        }

        .secondary-button:hover {
            background: #e8f4f5;
        }

        .footer-links {
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .footer-links a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 700;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-links p {
            margin: 0 0 8px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <span>HelpDesk</span>
    </div>
    <div class="page-content">
        <main class="register-card">
            <h1>Account aanmaken</h1>
            <p class="subtitle">Maak een studentaccount aan om de helpdesk te gebruiken.</p>

            {% if message %}
                <div class="notice">{{ message }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="name">Gebruikersnaam</label>
                    <input type="text" id="name" name="name" value="{{ name|default:'' }}" maxlength="100" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mailadres</label>
                    <input type="email" id="email" name="email" value="{{ email|default:'' }}" required>
                </div>

                <div class="form-group">
                    <label for="password">Wachtwoord</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="password2">Bevestig wachtwoord</label>
                    <input type="password" id="password2" name="password2" required>
                </div>

                <div class="form-group">
                    <label for="class_group">Klas</label>
                    <select id="class_group" name="class_group" required>
                        <option value="" disabled {% if not selected_class_group %}selected{% endif %}>Kies een klas</option>
                        {% for class_group in class_groups %}
                            <option value="{{ class_group.pk }}" {% if selected_class_group == class_group.pk|stringformat:"s" %}selected{% endif %}>
                                {{ class_group.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit">Account aanmaken</button>
                <a class="secondary-button" href="{% url 'login' %}">Inloggen</a>
            </form>

            <div class="footer-links">
                <p>Al een account? <a href="{% url 'login' %}">Inloggen</a></p>
                <p><a href="{% url 'reset_password' %}">Wachtwoord vergeten?</a></p>
            </div>
        </main>
    </div>
</body>
</html>
