<h1>Home</h1>

{% if user.is_authenticated %}
    <p>Welcome {{ user.username }}</p>

    {% if user.is_staff %}
        <p>You are an ADMIN</p>
    {% else %}
        <p>You are a NORMAL USER</p>
    {% endif %}

    <p><a href="{% url 'home' %}">Klassen bekijken</a></p>
    <a href="{% url 'logout' %}">Logout</a>

{% else %}
    <a href="{% url 'login' %}">Login</a>
{% endif %}
