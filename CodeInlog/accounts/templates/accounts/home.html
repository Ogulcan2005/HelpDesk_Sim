<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Home - CodeInlog</title>
</head>
<body>

<h1>Welkom bij CodeInlog</h1>

{% if messages %}
    {% for message in messages %}
        <p style="color: green;"><strong>{{ message }}</strong></p>
    {% endfor %}
{% endif %}

<p>Je bent ingelogd als <strong>{{ user.username }}</strong>.</p>
<p>Rol: <strong>{{ role }}</strong></p>

{% if user.is_staff %}
    <p><a href="/admin/">Naar admin panel</a></p>
{% endif %}

<p><a href="{% url 'logout' %}">Uitloggen</a></p>

</body>
</html>
