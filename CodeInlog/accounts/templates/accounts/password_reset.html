{% load static %}
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachtwoord vergeten - HelpDesk</title>
    <link rel="stylesheet" href="{% static 'accounts/css/password_reset.css' %}">
</head>
<body>
    <div class="topbar"><span>HelpDesk</span></div>
    <div class="page-content">
        <main class="card">
            <h1>Wachtwoord vergeten</h1>
            <p class="subtitle">
                Vul je e-mailadres in. Je ontvangt een link om een nieuw wachtwoord in te stellen.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_email">E-mailadres</label>
                    {{ form.email }}
                    {{ form.email.errors }}
                </div>
                <button type="submit">Verstuur resetlink</button>
            </form>

            <a class="back-link" href="{% url 'login' %}">← Terug naar inloggen</a>
        </main>
    </div>
</body>
</html>
