<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen - HelpDesk</title>
    <style>
        :root {
            --brand: #007d84;
            --brand-dark: #00676d;
            --bg: #eef2f6;
            --text: #1f2933;
            --muted: #5b6770;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--brand);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 18px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            gap: 10px;
            z-index: 10;
        }

        .page-content {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 92px 20px 24px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 14px 30px rgba(17, 24, 39, 0.12);
            padding: 26px 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        .subtitle {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .error {
            margin: 0 0 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #fde8e8;
            color: #7a1f1f;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            border: 1px solid #c8d2db;
            border-radius: 8px;
            padding: 12px 13px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(0, 125, 132, 0.15);
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 4px;
        }

        button:hover {
            background: var(--brand-dark);
        }

        .forgot-password {
            text-align: right;
            margin: -2px 0 14px;
        }

        .forgot-password a {
            color: var(--brand);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .secondary-button {
            display: block;
            width: 100%;
            border: 1px solid var(--brand);
            border-radius: 8px;
            color: var(--brand);
            background: #fff;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 16px;
            text-align: center;
            text-decoration: none;
            margin-top: 10px;
            transition: background 0.15s ease;
        }

        .secondary-button:hover {
            background: #e8f4f5;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <span>HelpDesk</span>
    </div>
    <div class="page-content">
        <main class="login-card">
            <h1>Inloggen</h1>
            <p class="subtitle">Log in om de helpdesk chatbot te gebruiken.</p>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">E-mailadres</label>
                    <input type="email" id="email" name="email" placeholder="Vul je e-mailadres in" required>
                </div>
                <div class="form-group">
                    <label for="password">Wachtwoord</label>
                    <input type="password" id="password" name="password" placeholder="Vul je wachtwoord in" required>
                </div>
                <div class="forgot-password">
                    <a href="{% url 'reset_password' %}">Wachtwoord vergeten?</a>
                </div>
                <button type="submit">Inloggen</button>
                <a class="secondary-button" href="{% url 'register' %}">Account maken</a>
            </form>
        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>

<!-- PSEUDOCODE:
SHOW error if backend sends one
-->
{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<!-- LOGIN FORM -->
<form method="POST">
    {% csrf_token %}

    <!-- EMAIL FIELD -->
    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <!-- PASSWORD FIELD -->
    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <!-- LOGIN BUTTON -->
    <button type="submit">Login</button>
</form>

<br>

<!-- EXTRA BUTTONS -->
<p>
    <a href="{% url 'reset_password' %}">Forgot password?</a>
</p>

<p>
    Don't have an account? 
    <a href="{% url 'register' %}">Create one</a>
</p>

</body>
