<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail verstuurd - HelpDesk</title>
    <style>
        :root {
            --brand: #007d84;
            --bg: #eef2f6;
            --text: #1f2933;
            --muted: #5b6770;
            --card: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--brand);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 18px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            z-index: 10;
        }

        .page-content {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 92px 20px 24px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 14px 30px rgba(17, 24, 39, 0.12);
            padding: 26px 24px;
        }

        h1 { margin: 0 0 8px; font-size: 2rem; }

        .subtitle {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .notice {
            padding: 10px 12px;
            border-radius: 10px;
            background: #e7f6f7;
            color: #0f4d52;
            font-weight: 700;
            line-height: 1.5;
        }

        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: var(--brand);
            text-decoration: none;
            font-weight: 700;
        }

        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="topbar"><span>HelpDesk</span></div>
    <div class="page-content">
        <main class="card">
            <h1>E-mail verstuurd</h1>
            <p class="subtitle">
                Als er een account bestaat met dit e-mailadres, is er een resetlink verstuurd.
            </p>
            <div class="notice">
                In deze ontwikkelomgeving verschijnt de e-mail in de terminal van de server.
                Open de link uit de terminal om je wachtwoord te resetten.
            </div>
            <a class="back-link" href="{% url 'login' %}">← Terug naar inloggen</a>
        </main>
    </div>
</body>
</html>
