<!DOCTYPE html>
<html>
<head>
    <title>Classes</title>
</head>

<body>

    <h1>Class Groups</h1>

    <p>
        Logged in as: {{ request.user.username }}
    </p>

    <p>
        <a href="/chat/">Open AI Chat</a> |
        <a href="/logout/">Logout</a>
    </p>

    <hr>

    {% if groups %}

    <ul>
        {% for group in groups %}
        <li>
            <a href="/class/{{ group.id }}/">
                {{ group.name }}
            </a>
        </li>
        {% endfor %}
    </ul>

    {% else %}

    <p>No class groups found.</p>

    {% endif %}

</body>
</html>
